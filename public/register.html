<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Bienvenue à la ferme</h1>
                <p class="auth-subtitle">Créez votre compte et découvrez les récoltes fraîches de ce matin.</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Créer mon compte</button>
            </form>
            
            <div class="auth-footer">
                Déjà un compte ? <a href="login.html" class="auth-link">Se connecter</a>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
