<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ShopList</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">ShopList</div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Bienvenue !</h1>
                <p class="auth-subtitle">Créez votre compte pour commencer.</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Créer mon compte</button>
            </form>
            
            <div class="auth-footer">
                Déjà un compte ? <a href="login.html" class="auth-link">Se connecter</a>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
