<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Coin Fermier - Ma Liste</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        
        <div id="creation">
            <p>Tous les produits et leur prix sont au kilo !<p>
        </div>
        <div id="pagination">
            <div class="search">
                <input type="text" id="recherche" placeholder="Rechercher...">
                <button id="validerRecherche">Valider</button>
                <button id="last-page">Précédente</button>
                <button id="next-page">Suivante</button>
            </div>
            <p id="index-pagination"></p>
        </div>

        <div id="listeProduits"></div>
    </div>

    <footer>
        &copy; 2026 Le Coin Fermier - Made by heart
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/liste.js"></script>
</body>
</html>
