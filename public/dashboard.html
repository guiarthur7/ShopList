<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container dashboard-container">
        <h1>Mon Panier</h1>
        <div id="listeProduits"></div>
        <div id="totalContainer">
            <span class="total-label">Total :</span>
            <span id="totalPrix">0.00€</span>
        </div>
        <a href="./index.html" class="dashboard-retour-link btn btn-dark" id="retourBtn">Retour à l'accueil</a>
    </div>

    <footer>
        &copy; 2026 Le Coin Fermier - Made by heart
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
