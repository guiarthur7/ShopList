<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Bon retour !</h1>
                <p class="auth-subtitle">Connectez-vous pour découvrir les récoltes du jour.</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
            
            <div class="auth-footer">
                Pas encore de compte ? <a href="register.html" class="auth-link">S'inscrire</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Le Coin Fermier - Made by heart
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
