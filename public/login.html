<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ShopList</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">ShopList</div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Bon retour !</h1>
                <p class="auth-subtitle">Connectez-vous pour accéder à vos listes.</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" class="form-control" placeholder="Nom d'utilisateur" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Se connecter</button>
            </form>
            
            <div class="auth-footer">
                Pas encore de compte ? <a href="register.html" class="auth-link">S'inscrire</a>
            </div>
        </div>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
