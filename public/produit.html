<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Produit - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/produit.css">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <div id="loading" class="loading">
        Chargement des détails du produit...
    </div>

    <div id="error-container"></div>

    <div id="product-container" style="display: none;">
        <div class="product-detail-container">
            <div class="product-detail-header">
                <h1 id="product-name"></h1>
            </div>

            <div id="product-image-section" style="display: none;">
                <img id="product-image" src="" alt="Photo du produit">
            </div>

            <div class="product-detail-body">
                <div class="detail-field">
                    <span class="detail-label">Prix</span>
                    <span class="detail-value" id="product-price"></span>
                </div>

                <div class="detail-field" id="description-section" style="display: none;">
                    <span class="detail-label">Description</span>
                    <p class="detail-description" id="product-description"></p>
                </div>
            </div>

            <div class="product-actions" id="product-actions">
            </div>

            <a href="/liste.html" class="btn btn-dark btn-retour">Retour</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Le Coin Fermier - Made by heart
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/produit.js"></script>
</body>
</html>
