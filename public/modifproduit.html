<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un produit - ShopList</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">ShopList</div>
            <nav id="nav-actions">
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <h1 class="auth-title">Modifier le produit</h1>
                <p class="auth-subtitle">Mettez à jour les informations du produit ci-dessous.</p>
            </header>

            <form id="editForm">
                <div class="form-group">
                    <label for="name">Nom du produit</label>
                    <input type="text" id="name" class="form-control" placeholder="Ex: Pommes" required>
                </div>
                <div class="form-group">
                    <label for="price">Prix (€)</label>
                    <input type="number" id="price" class="form-control" placeholder="Ex: 2.50" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Enregistrer les modifications</button>
            </form>

            <div class="auth-footer">
                <a href="/liste.html" class="auth-link">Retour à la liste</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 ShopList - Créé avec passion
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/modifier.js"></script>
</body>
</html>
