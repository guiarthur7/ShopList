<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier un produit - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <h1 class="auth-title">Modifier le produit</h1>
                <p class="auth-subtitle">Mettez à jour les informations du produit ci-dessous.</p>
            </header>

            <form id="editForm">
                <div class="form-group">
                    <label for="name">Nom du produit</label>
                    <input type="text" id="name" class="form-control" placeholder="Ex: Pommes" required>
                </div>
                <div class="form-group">
                    <label for="price">Prix (€)</label>
                    <input type="number" id="price" class="form-control" placeholder="Ex: 10" step="1" required>
                </div>
                <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
            </form>

            <div class="auth-footer">
                <a href="/liste.html" class="auth-link">Retour à la liste</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Le Coin Fermier - Made by heart
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/modifier.js"></script>
    <script>
        if (localStorage.username !== "admin") {
            window.location.href = "/liste.html"
        }
    </script>
</body>
</html>
