<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un Produit - Le Coin Fermier</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/creer_produit.css">
    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }
        const username = localStorage.getItem('username');
        if (username !== 'admin') {
            window.location.href = 'liste.html';
        }
    </script>
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/'">Le Coin Fermier</div>
            <nav id="nav-actions">
                <div class="auth-buttons-wrapper">
                    <a href="/login.html" class="btn header-btn">Connexion</a>
                    <a href="/register.html" class="btn btn-primary header-btn">S'inscrire</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="create-container">
        <div class="create-header">
            <h1>Ajouter un nouveau produit</h1>
        </div>

        <form id="createForm">
            <div class="form-group">
                <label for="nom">Nom du produit</label>
                <input type="text" id="nom" name="nom" placeholder="Ex: Pommes bio de ce matin" required>
            </div>

            <div class="form-group">
                <label for="prix">Prix (€)</label>
                <input type="number" id="prix" name="prix" placeholder="Ex: 2.50" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="description">Descirption</label>
                <textarea id="description" name="description" placeholder="Ex: Pommes bio de notre verger, récoltées ce matin..." rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="image">Photo
                </label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Créer</button>
                <a href="/liste.html" class="btn btn-cancel btn-cancel">Annuler</a>
            </div>
        </form>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/header.js"></script>
    <script src="js/creer_produit.js"></script>
</body>
</html>
